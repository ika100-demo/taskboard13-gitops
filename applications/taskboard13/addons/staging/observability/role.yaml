apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: otel-collector-logs
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: taskboard13
    app.kubernetes.io/managed-by: gitops-app
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - pods/log
  verbs:
  - get
