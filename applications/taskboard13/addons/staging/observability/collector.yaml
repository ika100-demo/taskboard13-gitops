apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: taskboard13
    app.kubernetes.io/managed-by: gitops-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: taskboard13
        app.kubernetes.io/managed-by: gitops-app
        app: otel-collector
      annotations:
        checksum/config: fe819a2a4f1485d4
        checksum/tailer: 5f38d30e83bc511a
    spec:
      serviceAccountName: otel-collector
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: collector
        image: otel/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
        args:
        - --config=/conf/config.yaml
        ports:
        - name: otlp-grpc
          containerPort: 4317
        - name: otlp-http
          containerPort: 4318
        - name: health
          containerPort: 13133
        readinessProbe:
          httpGet:
            path: /
            port: health
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: health
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: conf
          mountPath: /conf
      - name: log-tailer
        image: python:3.13.18-alpine3.24@sha256:7984cf56ceaddebe4fefeb75d64000b9f45d8b77b11a09b24524da6cdc3af0c8
        command:
        - python3
        - /tailer/tail.py
        env:
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: TAILER_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: TAILER_POD
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: TAILER_ENVIRONMENT
          value: staging
        - name: TAILER_SYSTEM
          value: taskboard13
        - name: TAILER_OTLP_URL
          value: http://127.0.0.1:4318/v1/logs
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tailer
          mountPath: /tailer
          readOnly: true
        - name: sa-token
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
      volumes:
      - name: conf
        configMap:
          name: otel-collector
      - name: tailer
        configMap:
          name: otel-collector-tailer
      - name: sa-token
        projected:
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
          - downwardAPI:
              items:
              - path: namespace
                fieldRef:
                  fieldPath: metadata.namespace
